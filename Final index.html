  <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ff416c,#ff4b2b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    text-align:center;
    color:white;
}

.container{
    background: rgba(255,255,255,0.15);
    padding:30px;
    border-radius:20px;
    backdrop-filter: blur(10px);
    width:90%;
    max-width:400px;
}

img{
    width:90%;
    max-width:300px;
    border-radius:20px;
    margin-bottom:15px;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:20px;
    font-size:16px;
    cursor:pointer;
}

.yes{
    background:#00ff88;
    color:black;
}

.no{
    background:#ff0033;
    color:white;
    position:relative;
}

@keyframes float{
    from{transform:translateY(100vh);opacity:1;}
    to{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>

<body>

<div class="container">
    <img id="slideshow" src="IMG-20251210-WA0006.jpg">

    <p style="font-size:14px; margin:10px;">🎵 Tap anywhere to play “Neelothi” ❤️</p>

    <h1 id="title">For My Love ❤️</h1>
    <p id="message">You mean the world to me ❤️ - Your Boy</p>
    <h2>Will you be mine forever? 💍</h2>

    <button class="yes" onclick="sayYes()">YES 💖</button>
    <button class="no" id="noBtn" onmouseover="moveNo()">NO 😜</button>

    <p id="countdown"></p>
</div>

<!-- Invisible YouTube Audio Only -->
<iframe
    id="ytAudio"
    width="0"
    height="0"
    src="https://www.youtube.com/embed/nMUmySghIL0?autoplay=0&controls=0&loop=1&playlist=nMUmySghIL0"
    allow="autoplay"
    frameborder="0">
</iframe>

<script>
document.body.addEventListener("click", function playSong(){
    document.getElementById("ytAudio").src += "&autoplay=1";
    document.body.removeEventListener("click", playSong);
});

/* YES BUTTON */
function sayYes(){
  alert("Yayyy ❤️ I love youuuuu 😘");
  for(let i=0;i<30;i++){
    const spark = document.createElement("div");
    spark.innerText="🎆";
    spark.style.position="fixed";
    spark.style.left=Math.random()*100+"vw";
    spark.style.top=Math.random()*100+"vh";
    spark.style.fontSize="30px";
    document.body.appendChild(spark);
    setTimeout(()=>spark.remove(),2000);
  }
}

/* NO BUTTON */
function moveNo(){
  const btn=document.getElementById("noBtn");
  btn.style.position="absolute";
  btn.style.top=Math.random()*80+"%";
  btn.style.left=Math.random()*80+"%";
}

/* FLOATING HEARTS */
setInterval(()=>{
  const heart=document.createElement("div");
  heart.innerText="💖";
  heart.style.position="fixed";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*20+10)+"px";
  heart.style.animation="float 4s linear";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),4000);
},500);

/* SLIDESHOW */
const images=[
  "IMG-20251210-WA0006.jpg",
  "IMG-20260108-WA0003.jpg",
  "IMG-20260108-WA0012.jpg"
];
let i=0;
setInterval(()=>{
  i=(i+1)%images.length;
  document.getElementById("slideshow").src=images[i];
},2000);

/* COUNTDOWN */
const targetDate=new Date("Feb 14, 2026 00:00:00").getTime();
setInterval(()=>{
  const now=new Date().getTime();
  const distance=targetDate-now;
  const days=Math.floor(distance/(1000*60*60*24));
  document.getElementById("countdown").innerText="❤️ Our Special Day in: "+days+" days ❤️";
},1000);
</script>

</body>
    </html>
