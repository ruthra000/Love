<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  text-align:center;
  color:white;
}

.container{
  background:rgba(255,255,255,0.15);
  padding:25px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  width:90%;
  max-width:400px;
}

.hidden{display:none;}

button{
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
}

.yes{background:#00ff88;color:black;}
.no{background:#ff0033;color:white;position:relative;}

input{
  padding:10px;
  border:none;
  border-radius:10px;
}

img{
  width:100%;
  border-radius:15px;
  margin-bottom:15px;
}

@keyframes float{
  from{transform:translateY(100vh);opacity:1;}
  to{transform:translateY(-10vh);opacity:0;}
}

@keyframes zoom{
  from{transform:scale(1);}
  to{transform:scale(1.1);}
}

/* FINAL SCREEN FULL BACKGROUND */
#final{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-image:url("IMG-20260108-WA0012.jpg"); /* 🔥 your couple pic */
  background-size:cover;
  background-position:center;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:20;
}

.bigLove{
  font-size:35px;
  animation:zoom 1.5s infinite alternate;
  color:white;
  text-shadow:2px 2px 15px black;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div class="container" id="lock">
  <h2>🔐 Enter Secret Password</h2>
  <input type="password" id="pass" placeholder="Enter password">
  <br>
  <button onclick="checkPass()">Unlock ❤️</button>
</div>

<!-- LOVE LETTER -->
<div class="container hidden" id="letter">
  <h2 id="typing"></h2>
  <button onclick="goProposal()">Continue 💖</button>
</div>

<!-- PROPOSAL -->
<div class="container hidden" id="proposal">
  <img id="slide" src="IMG-20251210-WA0006.jpg">
  <h2>Will you be mine forever? 💍</h2>
  <button class="yes" onclick="finalLove()">YES 💖</button>
  <button class="no" id="noBtn" onmouseover="moveNo()">NO 😜</button>
</div>

<!-- FINAL SCREEN -->
<div class="hidden" id="final">
  <h1 class="bigLove">I LOVE YOU SO MUCH ❤️</h1>
</div>

<audio id="music" loop>
  <source src="Neelothi.mp3" type="audio/mpeg">
</audio>

<script>

/* PASSWORD */
function checkPass(){
  if(document.getElementById("pass").value === "yes"){
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("letter").classList.remove("hidden");
    document.getElementById("music").play();
    typeLetter();
  } else {
    alert("Wrong password 😜");
  }
}

/* TYPING LETTER */
const text = "From the day you came into my life, everything became beautiful ❤️";
let i=0;
function typeLetter(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeLetter,50);
  }
}

function goProposal(){
  document.getElementById("letter").classList.add("hidden");
  document.getElementById("proposal").classList.remove("hidden");
}

/* SLIDESHOW */
const images=[
  "IMG-20251210-WA0006.jpg",
  "IMG-20260108-WA0003.jpg",
  "IMG-20260108-WA0012.jpg"
];
let s=0;
setInterval(()=>{
  s=(s+1)%images.length;
  document.getElementById("slide").src=images[s];
},2000);

/* NO BUTTON RUN */
function moveNo(){
  const btn=document.getElementById("noBtn");
  btn.style.position="absolute";
  btn.style.top=Math.random()*80+"%";
  btn.style.left=Math.random()*80+"%";
}

/* FINAL SCREEN */
function finalLove(){
  document.getElementById("proposal").classList.add("hidden");
  document.getElementById("final").classList.remove("hidden");

  for(let i=0;i<40;i++){
    const heart=document.createElement("div");
    heart.innerText="💖";
    heart.style.position="fixed";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*25+15)+"px";
    heart.style.animation="float 4s linear";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),4000);
  }
}

</script>

</body>
</html>
