<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    text-align:center;
    color:white;
}

.container{
    background:rgba(255,255,255,0.15);
    padding:25px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    width:90%;
    max-width:380px;
}

input{
    padding:10px;
    border:none;
    border-radius:15px;
    width:80%;
    margin:10px 0;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:20px;
    font-size:16px;
    cursor:pointer;
}

.hidden{display:none;}

@keyframes float{
    from{transform:translateY(100vh);opacity:1;}
    to{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>

<body>

<!-- 🔒 PASSWORD SCREEN -->
<div class="container" id="lockScreen">
    <h2>Enter Secret Name ❤️</h2>
    <input type="text" id="secretInput" placeholder="Type her name...">
    <br>
    <button onclick="checkPassword()">Unlock 💖</button>
</div>

<!-- 💌 LOVE LETTER SCREEN -->
<div class="container hidden" id="letterScreen">
    <h2>My Dearest Love 💌</h2>
    <p>
        From the day you entered my life,
        everything became colorful and beautiful.
        You are my happiness, my peace, my everything ❤️
    </p>
    <button onclick="showProposal()">Continue 💖</button>
</div>

<!-- 💍 PROPOSAL SCREEN -->
<div class="container hidden" id="proposalScreen">
    <img id="slideshow" src="IMG-20251210-WA0006.jpg">
    <h1>Pavithra ❤️ Rohith</h1>
    <h2>Will you be mine forever? 💍</h2>
    <button onclick="sayYes()">YES 💖</button>
    <button id="noBtn" onmouseover="moveNo()">NO 😜</button>
</div>

<!-- 🎵 SONG -->
<audio id="bgMusic" loop>
  <source src="Neelothi.mp3" type="audio/mpeg">
</audio>

<script>

/* 🔒 PASSWORD CHECK */
function checkPassword(){
    const input=document.getElementById("secretInput").value.toLowerCase();
    if(input==="pavithra"){
        document.getElementById("lockScreen").classList.add("hidden");
        document.getElementById("letterScreen").classList.remove("hidden");
        document.getElementById("bgMusic").play();
    } else {
        alert("Wrong name da 😜");
    }
}

/* 💌 SHOW PROPOSAL */
function showProposal(){
    document.getElementById("letterScreen").classList.add("hidden");
    document.getElementById("proposalScreen").classList.remove("hidden");
}

/* 💖 YES */
function sayYes(){
    alert("I LOVE YOU SO MUCH ❤️");
    for(let i=0;i<25;i++){
        const fire=document.createElement("div");
        fire.innerText="💖";
        fire.style.position="fixed";
        fire.style.left=Math.random()*100+"vw";
        fire.style.top=Math.random()*100+"vh";
        fire.style.fontSize="30px";
        document.body.appendChild(fire);
        setTimeout(()=>fire.remove(),2000);
    }
}

/* 😜 NO RUN */
function moveNo(){
    const btn=document.getElementById("noBtn");
    btn.style.position="absolute";
    btn.style.top=Math.random()*80+"%";
    btn.style.left=Math.random()*80+"%";
}

/* ❤️ NAME RAIN */
setInterval(()=>{
    const rain=document.createElement("div");
    rain.innerText="Pavithra ❤️ Rohith";
    rain.style.position="fixed";
    rain.style.left=Math.random()*100+"vw";
    rain.style.fontSize="14px";
    rain.style.animation="float 4s linear";
    document.body.appendChild(rain);
    setTimeout(()=>rain.remove(),4000);
},700);

/* 📸 SLIDESHOW */
const images=[
  "IMG-20251210-WA0006.jpg",
  "IMG-20260108-WA0003.jpg",
  "IMG-20260108-WA0012.jpg"
];

let i=0;
setInterval(()=>{
  i=(i+1)%images.length;
  const img=document.getElementById("slideshow");
  if(img) img.src=images[i];
},2000);

</script>

</body>
    </html>
