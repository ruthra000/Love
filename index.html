<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  text-align:center;
  color:white;
}

/* Glass card */
.container{
  background:rgba(255,255,255,0.15);
  padding:25px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  width:90%;
  max-width:420px;
}

.hidden{display:none;}

button{
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
}

.yes{background:#00ff88;color:black;}
.no{background:#ff0033;color:white;position:relative;}
input{padding:10px;border:none;border-radius:10px;margin:10px 0;}

img{width:100%;border-radius:15px;margin-bottom:15px;}

@keyframes float{
  from{transform:translateY(100vh);opacity:1;}
  to{transform:translateY(-10vh);opacity:0;}
}
@keyframes zoom{
  from{transform:scale(1);}
  to{transform:scale(1.12);}
}
.bigLove{font-size:34px;animation:zoom 1.5s infinite alternate;}

/* Stars */
@keyframes twinkle{
  0%{opacity:0.2;}
  50%{opacity:1;}
  100%{opacity:0.2;}
}
.star{
  position:fixed;
  background:white;
  border-radius:50%;
  animation:twinkle 2s infinite;
}
</style>
</head>

<body>

<!-- 🔐 PASSWORD -->
<div class="container" id="lock">
  <h2>🔐 Enter Secret Password</h2>
  <input type="password" id="pass" placeholder="Enter password">
  <br>
  <button onclick="checkPass()">Unlock ❤️</button>
</div>

<!-- 💌 STORY -->
<div class="container hidden" id="story">
  <h3 id="typing"></h3>
  <button onclick="goProposal()">Continue 💖</button>
</div>

<!-- 💍 PROPOSAL -->
<div class="container hidden" id="proposal">
  <img id="slide" src="IMG-20251210-WA0006.jpg">
  <h2>Will you be mine forever? 💍</h2>
  <p id="daysCounter"></p>
  <button class="yes" onclick="finalLove()">YES 💖</button>
  <button class="no" id="noBtn" onmouseover="moveNo()">NO 😜</button>
</div>

<!-- 💖 FINAL -->
<div class="container hidden" id="final">
  <h1 class="bigLove">I LOVE YOU FOREVER ❤️</h1>
</div>

<audio id="music" loop>
  <source src="Neelothi.mp3" type="audio/mpeg">
</audio>

<script>

/* ===== PASSWORD ===== */
function checkPass(){
  if(document.getElementById("pass").value === "yes"){
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("story").classList.remove("hidden");
    document.getElementById("music").play();
    typeLetter();
  } else {
    alert("Wrong password 😜");
  }
}

/* ===== TYPING STORY ===== */
const text = "The day I saw you, my world changed forever ❤️ You are my happiness, my peace, my everything.";
let i=0;
function typeLetter(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeLetter,40);
  }
}

function goProposal(){
  document.getElementById("story").classList.add("hidden");
  document.getElementById("proposal").classList.remove("hidden");
}

/* ===== SLIDESHOW ===== */
const images=[
  "IMG-20251210-WA0006.jpg",
  "IMG-20260108-WA0003.jpg",
  "IMG-20260108-WA0012.jpg"
];
let s=0;
setInterval(()=>{
  if(document.getElementById("slide")){
    s=(s+1)%images.length;
    document.getElementById("slide").src=images[s];
  }
},2000);

/* ===== LOVE DAYS COUNTER ===== */
const startDate = new Date("Jan 1, 2025"); // 🔥 change this
const today = new Date();
const diffTime = today - startDate;
const diffDays = Math.floor(diffTime / (1000*60*60*24));
document.getElementById("daysCounter").innerText =
  "We have loved each other for " + diffDays + " days ❤️";

/* ===== NO BUTTON RUN ===== */
function moveNo(){
  const btn=document.getElementById("noBtn");
  btn.style.position="absolute";
  btn.style.top=Math.random()*80+"%";
  btn.style.left=Math.random()*80+"%";
}

/* ===== FINAL LOVE ===== */
function finalLove(){
  document.getElementById("proposal").classList.add("hidden");
  document.getElementById("final").classList.remove("hidden");

  for(let i=0;i<50;i++){
    const heart=document.createElement("div");
    heart.innerText="💖";
    heart.style.position="fixed";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*30+15)+"px";
    heart.style.animation="float 4s linear";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),4000);
  }
}

/* ===== STAR BACKGROUND ===== */
for(let i=0;i<70;i++){
  const star=document.createElement("div");
  star.classList.add("star");
  star.style.width="3px";
  star.style.height="3px";
  star.style.top=Math.random()*100+"vh";
  star.style.left=Math.random()*100+"vw";
  document.body.appendChild(star);
}

/* ===== MOUSE SPARKLE ===== */
document.addEventListener("mousemove", function(e){
  const sparkle=document.createElement("div");
  sparkle.innerText="✨";
  sparkle.style.position="fixed";
  sparkle.style.left=e.clientX+"px";
  sparkle.style.top=e.clientY+"px";
  sparkle.style.fontSize="15px";
  document.body.appendChild(sparkle);
  setTimeout(()=>sparkle.remove(),500);
});

</script>

</body>
</html>
