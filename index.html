<!DOCTYPE html>
<html>
<body style="background:#ff416c;color:white;text-align:center;padding-top:100px;">

<h2>Enter Password ❤️</h2>
<input type="password" id="p">
<button onclick="check()">Unlock</button>

<div id="main" style="display:none;">
  <h2>Will you be mine forever? 💍</h2>
  <button onclick="alert('I LOVE YOU ❤️')">YES 💖</button>
</div>

<audio id="music" loop>
  <source src="Neelothi.mp3" type="audio/mpeg">
</audio>

<script>
function check(){
  if(document.getElementById("p").value==="yes"){
    document.getElementById("main").style.display="block";
    document.getElementById("music").play();
  } else {
    alert("Wrong password 😜");
  }
}
</script>

</body>
</html>
